spring.application.name=HotelService

server.port=8082

# if we want to use different database so same thing on chnage this par example
# spring.datasource.url=jdbc:postgresql://localhost:("port no given in postgresql")/microservices
spring.datasource.url=jdbc:mysql://localhost:3306/microservices
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
